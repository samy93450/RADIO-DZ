/* Passeport seul, sans fond ni ombre extérieure. */
html,body{background:transparent!important;color-scheme:normal}
.cover{box-shadow:none!important}
.cover>img{filter:saturate(1.38) contrast(1.09) brightness(1.06)}
.station,.controls button,.volume{color:#ffda7d}
.station{background:transparent;border-color:#eac56c80;text-shadow:0 1px 2px #002c1f}
.status{color:#f5d98e}.volume input{accent-color:#edc763}

/* Couverture en relief et dorure embossée, sans décor extérieur. */
.relief-defs{position:absolute;overflow:hidden;pointer-events:none}
body{perspective:1300px}
.cover{isolation:isolate;transform-style:preserve-3d;transform:perspective(1300px) rotateY(-7deg) rotateX(2deg) scale(.915);border-radius:5px 13px 13px 5px;overflow:visible;box-shadow:2px 3px 0 #173f28,4px 5px 0 #062b21,6px 7px 0 #244f36,8px 9px 0 #03281b!important}
.cover:before{content:'';position:absolute;inset:3px -7px -6px 3px;border-radius:5px 14px 14px 5px;background:linear-gradient(90deg,#063024 94%,#71926a 96%,#0b3527 98%,#001c12);z-index:-1;pointer-events:none}
.cover:after{content:'';position:absolute;inset:0;border-radius:inherit;box-shadow:inset 3px 0 4px #001e1699,inset -1px 0 2px #90bd8366,inset 0 1px 1px #d0e3a84d;background:linear-gradient(113deg,#ffffff0a,transparent 28%,transparent 80%,#0000000b);pointer-events:none;z-index:3}
.cover>img{position:relative;border-radius:inherit;filter:saturate(1.38) contrast(1.09) brightness(1.06) url(#gold-relief)}
.station,.controls,.volume,.status,.credit{z-index:2}
.station,.controls button{font-weight:600;color:#ffdf87;text-shadow:0 -1px 0 #fff4be,0 1px 0 #9d7027,0 2px 0 #6c4317,1px 3px 2px #001c12}
.status,.volume{color:#f7d58c;text-shadow:0 1px 0 #71501d,0 2px 2px #001d16}
.station{border-color:#d7b05788}
.controls button:active{transform:translateY(2px);text-shadow:0 1px 1px #001c12}
@media(max-width:600px){.cover{transform:perspective(1000px) rotateY(-4deg) rotateX(1deg) scale(.93)}}
@media(orientation:landscape) and (max-height:500px){.cover{transform:perspective(1000px) rotateY(-4deg) scale(.93)}}
@media(prefers-reduced-motion:reduce){.cover{transition:none}}

/* Vue strictement de face : relief conservé, aucune inclinaison. */
body{perspective:none}
.cover{transform:none!important;transform-style:flat;box-shadow:1px 1px 0 #173f28,2px 2px 0 #062b21,3px 3px 0 #244f36!important}
.cover:before{inset:2px -3px -3px 2px}

/* Cadre doré biseauté, intégré au contour sans couvrir les inscriptions. */
.cover{box-shadow:0 0 0 1px #fff0b0,0 0 0 3px #b98b35,0 0 0 4px #f9d982,0 0 0 6px #75501b!important;width:min(calc(100% - 16px),calc((100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px) - 20px)*.674))}
.cover:before{inset:-6px;border-radius:9px 17px 17px 9px;background:linear-gradient(135deg,#ffeeb4 0%,#a16b20 15%,#f9da86 32%,#c0923c 48%,#77501b 66%,#f6d37c 84%,#b68832 100%);z-index:-1}
.cover:after{box-shadow:inset 1px 1px 1px #ffe6a475,inset -1px -1px 1px #68451199}

/* Signature lisible sur iPhone 14 Plus, volume séparé. */
.cover{container-type:inline-size}
.credit{top:96.9%;left:3%;width:94%;height:2.8%;display:flex;align-items:center;justify-content:center;font-family:system-ui,sans-serif;font-size:clamp(10px,2.8cqw,16px);font-weight:750;letter-spacing:.35px;line-height:1.2;color:#ffe29a;text-shadow:0 1px 0 #78501d,0 2px 2px #001a10;white-space:nowrap}

/* Signature assortie aux capitales à empattements du passeport. */
